# Managed by project-validation-bootstrap.
default_install_hook_types: [pre-commit]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
        # Three approved source videos; exact hashes and size caps are enforced in native tests.
        exclude: ^public/media/workflow-scene-0[1-3]\.mp4$
      - id: check-ast
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
      - id: mixed-line-ending
        args: [--fix=no]

  - repo: local
    hooks:
      - id: project-node-lint
        name: project node lint
        entry: npm run lint --
        language: system
        files: \.(js|jsx|mjs|ts|tsx|mts)$
      - id: project-workflow-contracts
        name: workflow behavior and approved media checks
        entry: node --test tests/workflow-demo.test.mjs
        language: system
        pass_filenames: false
        files: ^(public/media/|lib/workflow-demo\.ts$|components/workflow-demo\.tsx$|tests/workflow-demo\.test\.mjs$|\.pre-commit-config\.yaml$)
